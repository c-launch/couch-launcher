<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'">
<title>Player controls</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap">
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div id="hud" class="hidden" aria-live="off">
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>
  <header class="head"><button class="mb m-only" data-m="exit" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.25 5.5L8.75 12l6.5 6.5"/></svg></button><div><div class="title" id="title"></div><div class="sub" id="sub"></div></div></header>
  <div class="center" id="center"></div>
  <aside class="upnext" id="upnext" hidden><div class="un-k" id="un-k">UP NEXT</div><div class="un-t" id="un-t"></div><div class="un-b p-only"><span class="g a">A</span>Play now<span class="g">B</span>Back</div><div class="un-m m-only"><button class="mt on" data-m="press" data-x="A">Play now</button><button class="mt" data-m="press" data-x="B">Back</button></div></aside>
  <aside class="menu" id="menu" hidden><h2 id="menu-t"></h2><div class="menu-list" id="menu-list"></div></aside>
  <section class="controls">
    <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"><span class="tip" id="tip"></span></div></div>
    <div class="times"><span id="pos">0:00</span><span id="left">0:00</span></div>
    <div class="row">
      <div class="mplay m-only" id="mplay"><button class="mb t" data-m="seekBy" data-x="-10" aria-label="Back 10 seconds">−10</button><button class="mb big" data-m="toggle" id="m-toggle" aria-label="Play or pause"><span class="i-play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5.6v12.8a.6.6 0 0 0 .92.5l9.9-6.4a.6.6 0 0 0 0-1L9.42 5.1a.6.6 0 0 0-.92.5z" fill="currentColor" stroke="none"/></svg></span><span class="i-pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5.5v13M15.5 5.5v13" stroke-width="3"/></svg></span></button><button class="mb t" data-m="seekBy" data-x="30" aria-label="Forward 30 seconds">+30</button></div>
      <div class="btns" id="btns"></div>
      <button class="mb m-only" data-m="fullscreen" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <div class="hints p-only"><span><span class="g a">A</span><b id="h-a">Pause</b></span><span><span class="g w">LB RB</span>−10 s / +30 s</span><span><span class="g">Y</span>Subtitles</span><span><span class="g">B</span>Back</span></div>
    </div>
  </section>
</div>
<div id="cable" hidden>
  <div class="cb-blank" id="cb-blank"></div>
  <nav class="cb-strip-m m-only" id="cb-strip-m" aria-label="Cable TV"><button class="mt" data-m="exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.25 5.5L8.75 12l6.5 6.5"/></svg>Guide</button><button class="mb" data-m="chan" data-x="1" aria-label="Channel up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button class="mb" data-m="chan" data-x="-1" aria-label="Channel down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><button class="mb" data-m="info" aria-label="What’s on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button><button class="mb" data-m="captions" aria-label="Captions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"/></svg></button><button class="mb" data-m="fullscreen" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></nav>
  <div class="cb-num" id="cb-num"><b id="cb-n"></b><span id="cb-cn"></span></div>
  <div class="cb-status" id="cb-status"></div>
  <div class="cb-card" id="cb-card"><div class="cb-ck" id="cb-ck"></div><div class="cb-ct" id="cb-ct"></div><div class="cb-cs" id="cb-cs"></div></div>
  <div class="cb-break" id="cb-break" hidden><div class="cb-bk" id="cb-bk"></div><div class="cb-bt" id="cb-bt"></div><div class="cb-bw" id="cb-bw"></div><div class="cb-why" id="cb-why"></div></div>
  <section class="cb-banner" id="cb-banner">
    <div class="cb-ch"><span class="cb-strip" id="cb-strip"></span><b id="cb-bn"></b><span id="cb-bname"></span></div>
    <div class="cb-now"><div class="cb-k" id="cb-time"></div><div class="cb-show" id="cb-show"></div><div class="cb-ep" id="cb-ep"></div><div class="cb-bar"><i id="cb-fill"></i></div></div>
    <div class="cb-next" id="cb-next"><div class="cb-k" id="cb-nt"></div><div class="cb-ns" id="cb-ns"></div></div>
    <div class="cb-hints p-only"><span><span class="g">↑↓</span>Channels</span><span><span class="g a">A</span>Info</span><span><span class="g">Y</span>Captions</span><span><span class="g">B</span>Guide</span></div>
  </section>
  <aside class="menu" id="cb-menu" hidden><h2 id="cb-menu-t"></h2><div class="menu-list" id="cb-menu-list"></div><div class="cb-menu-note" id="cb-menu-note"></div><div class="cb-menu-hints p-only"><span><span class="g a">A</span>Choose</span><span><span class="g">B</span>Close</span></div></aside>
</div>
<script src="hud.js"></script>
</body>
</html>
