<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'">
<title>Player controls</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap">
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div id="hud" class="hidden" aria-live="off">
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>
  <header class="head"><div class="title" id="title"></div><div class="sub" id="sub"></div></header>
  <div class="center" id="center"></div>
  <aside class="upnext" id="upnext" hidden><div class="un-k" id="un-k">UP NEXT</div><div class="un-t" id="un-t"></div><div class="un-b"><span class="g a">A</span>Play now<span class="g">B</span>Back</div></aside>
  <aside class="menu" id="menu" hidden><h2 id="menu-t"></h2><div class="menu-list" id="menu-list"></div></aside>
  <section class="controls">
    <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"><span class="tip" id="tip"></span></div></div>
    <div class="times"><span id="pos">0:00</span><span id="left">0:00</span></div>
    <div class="row">
      <div class="btns" id="btns"></div>
      <div class="hints"><span><span class="g a">A</span><b id="h-a">Pause</b></span><span><span class="g w">LB RB</span>−10 s / +30 s</span><span><span class="g">Y</span>Subtitles</span><span><span class="g">B</span>Back</span></div>
    </div>
  </section>
</div>
<div id="cable" hidden>
  <div class="cb-blank" id="cb-blank"></div>
  <div class="cb-num" id="cb-num"><b id="cb-n"></b><span id="cb-cn"></span></div>
  <div class="cb-status" id="cb-status"></div>
  <div class="cb-card" id="cb-card"><div class="cb-ck" id="cb-ck"></div><div class="cb-ct" id="cb-ct"></div><div class="cb-cs" id="cb-cs"></div></div>
  <div class="cb-break" id="cb-break" hidden><div class="cb-bk" id="cb-bk"></div><div class="cb-bt" id="cb-bt"></div><div class="cb-bw" id="cb-bw"></div><div class="cb-why" id="cb-why"></div></div>
  <section class="cb-banner" id="cb-banner">
    <div class="cb-ch"><span class="cb-strip" id="cb-strip"></span><b id="cb-bn"></b><span id="cb-bname"></span></div>
    <div class="cb-now"><div class="cb-k" id="cb-time"></div><div class="cb-show" id="cb-show"></div><div class="cb-ep" id="cb-ep"></div><div class="cb-bar"><i id="cb-fill"></i></div></div>
    <div class="cb-next" id="cb-next"><div class="cb-k" id="cb-nt"></div><div class="cb-ns" id="cb-ns"></div></div>
    <div class="cb-hints"><span><span class="g">↑↓</span>Channels</span><span><span class="g a">A</span>Info</span><span><span class="g">Y</span>Captions</span><span><span class="g">B</span>Guide</span></div>
  </section>
  <aside class="menu" id="cb-menu" hidden><h2 id="cb-menu-t"></h2><div class="menu-list" id="cb-menu-list"></div><div class="cb-menu-note" id="cb-menu-note"></div><div class="cb-menu-hints"><span><span class="g a">A</span>Choose</span><span><span class="g">B</span>Close</span></div></aside>
</div>
<script src="hud.js"></script>
</body>
</html>
